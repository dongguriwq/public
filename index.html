<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 맞추기 게임 (Stage 1~5)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .main-container {
            display: flex;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 750px;
        }
        .game-area {
            padding: 30px;
            text-align: center;
            flex: 1;
            border-right: 1px solid #eee;
        }
        .record-area {
            padding: 30px;
            background-color: #fafafa;
            width: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.6em;
        }
        h2 {
            color: #555;
            margin-top: 0;
            font-size: 1.2em;
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
        }
        .stage-info {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        .status {
            margin: 15px 0;
            font-size: 1em;
            color: #555;
        }
        input[type="number"] {
            width: 120px;
            padding: 10px;
            font-size: 1.1em;
            border: 2px solid #ddd;
            border-radius: 6px;
            text-align: center;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 1.1em;
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1976d2;
        }
        .message {
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: bold;
            min-height: 1.5em;
        }
        .up { color: #f44336; }
        .down { color: #3f51b5; }
        .success { color: #4caf50; }
        .fail { color: #9e9e9e; }
        
        .record-box {
            background-color: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 0.95em;
        }
        .record-box span {
            font-weight: bold;
            font-size: 1.1em;
        }
        .up-text { color: #f44336; }
        .down-text { color: #3f51b5; }

        .restart-btn {
            background-color: #4caf50;
            margin-top: 15px;
            display: none;
            width: 100%;
        }
        .restart-btn:hover {
            background-color: #388e3c;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="game-area">
        <h1>🎮 숫자 맞추기 게임</h1>
        <div id="stage-info" class="stage-info">Stage 1 (범위: 1~100)</div>
        
        <div class="status">
            <span id="chances-text">남은 기회: 10번</span>
        </div>

        <div id="input-area">
            <input type="number" id="guess-input" min="1" placeholder="숫자 입력">
            <button onclick="checkGuess()">입력</button>
        </div>

        <div id="message" class="message">게임을 시작합니다! 숫자를 맞춰보세요.</div>
        <button id="restart-btn" class="restart-btn" onclick="initGame()">처음부터 다시 시작</button>
    </div>

    <div class="record-area">
        <h2>📋 현재 스테이지 기록</h2>
        <div class="record-box">
            <div>▲ UP 중 가장 큰 값 (최솟값 힌트):</div>
            <div style="margin-top: 5px;"><span id="closest-up" class="up-text">-</span> 이상</div>
        </div>
        <div class="record-box">
            <div>▼ DOWN 중 가장 작은 값 (최댓값 힌트):</div>
            <div style="margin-top: 5px;"><span id="closest-down" class="down-text">-</span> 이하</div>
        </div>
    </div>
</div>

<script>
    // 5단계 기회 8번으로 업데이트 완료!
    const stages = {
        1: [100, 10],
        2: [200, 10],
        3: [500, 9],
        4: [1000, 11],
        5: [1000, 8]  // 9 -> 8로 수정
    };

    let currentStage = 1;
    let maxNum = 100;
    let maxChances = 10;
    let chancesLeft = 10;
    let secretNumber = 0;
    let gameOver = false;

    let closestUp = 1;
    let closestDown = null;

    function initStage(stage) {
        currentStage = stage;
        maxNum = stages[stage][0];
        maxChances = stages[stage][1];
        chancesLeft = maxChances;
        secretNumber = Math.floor(Math.random() * maxNum) + 1;
        
        closestUp = 1;
        closestDown = maxNum;
        updateRecordDisplay();

        document.getElementById('stage-info').innerText = `Stage ${currentStage} (범위: 1~${maxNum})`;
        document.getElementById('chances-text').innerText = `남은 기회: ${chancesLeft}번`;
        document.getElementById('guess-input').value = '';
        document.getElementById('guess-input').max = maxNum;
        document.getElementById('guess-input').disabled = false;
        document.getElementById('restart-btn').style.display = 'none';
        
        if(stage === 1) {
            document.getElementById('message').className = 'message';
            document.getElementById('message').innerText = '게임을 시작합니다! 숫자를 맞춰보세요.';
        }
    }

    function initGame() {
        gameOver = false;
        initStage(1);
    }

    function updateRecordDisplay() {
        document.getElementById('closest-up').innerText = closestUp;
        document.getElementById('closest-down').innerText = closestDown;
    }

    function checkGuess() {
        if (gameOver) return;

        const inputElement = document.getElementById('guess-input');
        const messageElement = document.getElementById('message');
        const chancesElement = document.getElementById('chances-text');
        
        const guess = parseInt(inputElement.value);

        if (isNaN(guess) || guess < 1 || guess > maxNum) {
            alert(`1부터 ${maxNum} 사이의 올바른 숫자를 입력해주세요.`);
            return;
        }

        chancesLeft--;

        if (guess === secretNumber) {
            messageElement.className = 'message success';
            if (currentStage < 5) {
                messageElement.innerText = `🎉 정답입니다! Stage ${currentStage} 클리어! 잠시 후 다음 단계로 이동합니다.`;
                inputElement.disabled = true;
                gameOver = true;
                setTimeout(() => {
                    gameOver = false;
                    initStage(currentStage + 1);
                    messageElement.className = 'message';
                    messageElement.innerText = `Stage ${currentStage} 시작! 숫자를 맞춰보세요.`;
                }, 2500);
            } else {
                messageElement.innerText = `🏆 축하합니다! 모든 단계를 클리어하여 최종 승리하셨습니다! 🏆`;
                endGame();
            }
        } else {
            if (guess < secretNumber) {
                messageElement.className = 'message up';
                messageElement.innerText = `▲ UP! 더 큰 숫자입니다.`;
                if (guess > closestUp) {
                    closestUp = guess;
                }
            } else {
                messageElement.className = 'message down';
                messageElement.innerText = `▼ DOWN! 더 작은 숫자입니다.`;
                if (guess < closestDown) {
                    closestDown = guess;
                }
            }

            updateRecordDisplay();
            chancesElement.innerText = `남은 기회: ${chancesLeft}번`;

            if (chancesLeft <= 0) {
                messageElement.className = 'message fail';
                messageElement.innerText = `💥 실패.. 정답은 ${secretNumber}였습니다. 게임 오버!`;
                endGame();
            }
        }
        
        inputElement.value = '';
        inputElement.focus();
    }

    function endGame() {
        document.getElementById('guess-input').disabled = true;
        document.getElementById('restart-btn').style.display = 'inline-block';
        gameOver = true;
    }

    document.getElementById('guess-input').addEventListener('keyup', function(event) {
        if (event.key === 'Enter') {
            checkGuess();
        }
    });

    window.onload = initGame;
</script>

</body>
</html>
